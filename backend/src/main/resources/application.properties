# ==============================================================================
# CONFIGURACIÓN DEL SISTEMA DE PLANILLAS (PRODUCCIÓN / DESARROLLO)
# ==============================================================================
server.port=8080

# Base de Datos SQL Server 2008
# Los valores se configuran mediante variables de entorno o mediante application-local.properties
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=SistemaPlanillasDB;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:TuPasswordSeguro123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuración Hibernate / Dialecto SQL Server 2008
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2008Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Importación opcional de credenciales locales privadas (ignorado en Git)
spring.config.import=optional:classpath:application-local.properties
