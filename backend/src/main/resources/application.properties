# ==============================================================================
# CONFIGURACIÓN DEL SISTEMA DE PLANILLAS (SUPABASE + CLOUDINARY)
# ==============================================================================
server.port=8080

# Base de Datos PostgreSQL (Supabase)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://<proyecto>.supabase.co:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:<password-supabase>}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración Hibernate / PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:<cloud-name>}
cloudinary.api-key=${CLOUDINARY_API_KEY:<api-key>}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:<api-secret>}

# Importación opcional de credenciales locales privadas (ignorado en Git)
spring.config.import=optional:classpath:application-local.properties
