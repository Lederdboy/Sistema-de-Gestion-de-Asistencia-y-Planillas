server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: sistema-asistencia-planillas
  
  # Configuración de Base de Datos (SQL Server 2008)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=AsistenciaPlanillasDB;encrypt=false;trustServerCertificate=true}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:YourPassword123}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  
  jpa:
    database-platform: org.hibernate.dialect.SQLServer2008Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServer2008Dialect
        format_sql: true

# Configuración CORS para Dev 1 (Frontend SPA)
cors:
  allowed-origins: "http://localhost:3000,http://localhost:5173"
